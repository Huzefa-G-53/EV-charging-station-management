{% extends 'base.html' %}
{% block title %}{{ 'Edit' if revenue else 'Record' }} Revenue{% endblock %}
{% block content %}
<div class="page-header">
  <h4>{{ 'Edit' if revenue else 'Record' }} Revenue</h4>
  <a href="{{ url_for('revenue.list_revenue') }}" class="btn btn-outline-secondary btn-sm mt-1">← Back</a>
</div>
<div class="form-container">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="station_id" class="form-label">Station <span class="text-danger">*</span></label>
        <select class="form-select" id="station_id" name="station_id" required>
          <option value="">— Select Station —</option>
          {% for st in stations %}
          <option value="{{ st.station_id }}" {% if revenue and revenue.station_id == st.station_id %}selected{% endif %}>{{ st.station_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label for="revenue_date" class="form-label">Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control" id="revenue_date" name="revenue_date"
               value="{{ revenue.revenue_date if revenue else '' }}" required>
      </div>
      <div class="col-md-4">
        <label for="source" class="form-label">Revenue Source <span class="text-danger">*</span></label>
        <select class="form-select" id="source" name="source" required>
          <option value="">— Select Source —</option>
          {% for s in revenue_sources %}
          <option value="{{ s }}" {% if revenue and revenue.source == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="amount" class="form-label">Amount (₹) <span class="text-danger">*</span></label>
        <input type="number" step="0.01" min="0.01" class="form-control" id="amount"
               name="amount" value="{{ revenue.amount if revenue else '' }}" required>
      </div>
      <div class="col-12">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="2">{{ revenue.description if revenue else '' }}</textarea>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">{{ 'Update' if revenue else 'Record' }} Revenue</button>
      <a href="{{ url_for('revenue.list_revenue') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
