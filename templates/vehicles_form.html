{% extends 'base.html' %}
{% block title %}{{ 'Edit' if vehicle else 'Add' }} Vehicle{% endblock %}
{% block content %}
<div class="page-header">
  <h4>{{ 'Edit' if vehicle else 'Add' }} Vehicle</h4>
  <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-outline-secondary btn-sm mt-1">← Back</a>
</div>

<div class="form-container">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label for="user_id" class="form-label">Owner (User) <span class="text-danger">*</span></label>
        <select class="form-select" id="user_id" name="user_id" required>
          <option value="">— Select User —</option>
          {% for u in users %}
          <option value="{{ u.user_id }}" {% if vehicle and vehicle.user_id == u.user_id %}selected{% endif %}>
            {{ u.full_name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label for="vehicle_number" class="form-label">Vehicle Number <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="vehicle_number" name="vehicle_number"
               value="{{ vehicle.vehicle_number if vehicle else '' }}" placeholder="e.g. MH01AB1234"
               style="text-transform:uppercase;" required>
      </div>
      <div class="col-md-4">
        <label for="vehicle_type" class="form-label">Vehicle Type <span class="text-danger">*</span></label>
        <select class="form-select" id="vehicle_type" name="vehicle_type" required>
          <option value="">— Select —</option>
          {% for t in ['SUV', 'Sedan', 'Hatchback', 'Van', 'Two Wheeler', 'Commercial'] %}
          <option value="{{ t }}" {% if vehicle and vehicle.vehicle_type == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="brand" class="form-label">Brand <span class="text-danger">*</span></label>
        <select class="form-select" id="brand" name="brand" required>
          <option value="">Select brand…</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="model" class="form-label">Model <span class="text-danger">*</span></label>
        <select class="form-select" id="model" name="model" required>
          <option value="">Select model…</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="battery_capacity" class="form-label">Battery Capacity (kWh) <span class="text-danger">*</span></label>
        <input type="number" step="0.01" min="0.01" class="form-control" id="battery_capacity"
               name="battery_capacity" value="{{ vehicle.battery_capacity if vehicle else '' }}" required>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">{{ 'Update' if vehicle else 'Add' }} Vehicle</button>
      <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  const EV_CATALOG = {
    'Tata': ['Nexon EV Max', 'Nexon EV Prime', 'Tiago EV', 'Punch EV', 'Curvv EV', 'Sierra EV'],
    'MG': ['ZS EV', 'Comet EV', 'Windsor EV'],
    'Hyundai': ['Ioniq 5', 'Kona Electric', 'Creta EV'],
    'Mahindra': ['XEV 9e', 'BE 6', 'e2o Plus', 'eXUV300'],
    'BYD': ['Atto 3', 'Seal', 'e6'],
    'Kia': ['EV6', 'EV9'],
    'Mercedes-Benz': ['EQS', 'EQB', 'EQA'],
    'BMW': ['iX', 'i4', 'i7', 'iX1'],
    'Audi': ['e-tron', 'e-tron GT', 'Q8 e-tron'],
    'Volvo': ['XC40 Recharge', 'C40 Recharge'],
    'Tesla': ['Model 3', 'Model Y', 'Model S', 'Model X'],
    'Ola Electric': ['S1 Pro', 'S1 Air', 'S1 X'],
    'Ather': ['450X', '450S', 'Rizta'],
    'TVS': ['iQube', 'iQube ST'],
    'Bajaj': ['Chetak Electric'],
    'Citroen': ['eC3'],
    'Porsche': ['Taycan', 'Taycan Cross Turismo'],
    'Jaguar': ['I-Pace']
  };

  const brandSelect = document.getElementById('brand');
  const modelSelect = document.getElementById('model');
  const preselectedBrand = '{{ vehicle.brand if vehicle else "" }}';
  const preselectedModel = '{{ vehicle.model if vehicle else "" }}';

  Object.keys(EV_CATALOG).sort().forEach(brand => {
    const opt = document.createElement('option');
    opt.value = brand;
    opt.textContent = brand;
    if (brand === preselectedBrand) opt.selected = true;
    brandSelect.appendChild(opt);
  });

  function populateModels(brand) {
    modelSelect.innerHTML = '<option value="">Select model…</option>';
    if (brand && EV_CATALOG[brand]) {
      EV_CATALOG[brand].forEach(model => {
        const opt = document.createElement('option');
        opt.value = model;
        opt.textContent = model;
        if (model === preselectedModel) opt.selected = true;
        modelSelect.appendChild(opt);
      });
    }
  }

  brandSelect.addEventListener('change', () => populateModels(brandSelect.value));
  if (preselectedBrand) populateModels(preselectedBrand);
</script>
{% endblock %}
