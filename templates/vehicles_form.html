{% extends 'base.html' %}
{% block title %}{{ 'Edit' if vehicle else 'Add' }} Vehicle{% endblock %}
{% block content %}
<div class="page-header">
  <h4>{{ 'Edit' if vehicle else 'Add' }} Vehicle</h4>
  <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-outline-secondary btn-sm mt-1">← Back</a>
</div>

<div class="form-container">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label for="user_id" class="form-label">Owner (User) <span class="text-danger">*</span></label>
        <select class="form-select" id="user_id" name="user_id" required>
          <option value="">— Select User —</option>
          {% for u in users %}
          <option value="{{ u.user_id }}" {% if vehicle and vehicle.user_id == u.user_id %}selected{% endif %}>
            {{ u.full_name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label for="vehicle_number" class="form-label">Vehicle Number <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="vehicle_number" name="vehicle_number"
               value="{{ vehicle.vehicle_number if vehicle else '' }}" placeholder="e.g. MH01AB1234"
               style="text-transform:uppercase;" required>
      </div>
      <div class="col-md-4">
        <label for="vehicle_type" class="form-label">Vehicle Type <span class="text-danger">*</span></label>
        <select class="form-select" id="vehicle_type" name="vehicle_type" required>
          <option value="">— Select —</option>
          {% for t in ['Hatchback','Sedan','SUV','MPV','Truck','Bus','Two-Wheeler','Other'] %}
          <option value="{{ t }}" {% if vehicle and vehicle.vehicle_type == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="brand" class="form-label">Brand <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="brand" name="brand"
               value="{{ vehicle.brand if vehicle else '' }}" placeholder="e.g. Tata" required>
      </div>
      <div class="col-md-4">
        <label for="model" class="form-label">Model <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="model" name="model"
               value="{{ vehicle.model if vehicle else '' }}" placeholder="e.g. Nexon EV" required>
      </div>
      <div class="col-md-4">
        <label for="battery_capacity" class="form-label">Battery Capacity (kWh) <span class="text-danger">*</span></label>
        <input type="number" step="0.01" min="0.01" class="form-control" id="battery_capacity"
               name="battery_capacity" value="{{ vehicle.battery_capacity if vehicle else '' }}" required>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">{{ 'Update' if vehicle else 'Add' }} Vehicle</button>
      <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
