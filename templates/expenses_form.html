{% extends 'base.html' %}
{% block title %}{{ 'Edit' if expense else 'Record' }} Expense{% endblock %}
{% block content %}
<div class="page-header">
  <h4>{{ 'Edit' if expense else 'Record' }} Expense</h4>
  <a href="{{ url_for('expenses.list_expenses') }}" class="btn btn-outline-secondary btn-sm mt-1">← Back</a>
</div>
<div class="form-container">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="station_id" class="form-label">Station <span class="text-danger">*</span></label>
        <select class="form-select" id="station_id" name="station_id" required>
          <option value="">— Select Station —</option>
          {% for st in stations %}
          <option value="{{ st.station_id }}" {% if expense and expense.station_id == st.station_id %}selected{% endif %}>{{ st.station_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label for="expense_date" class="form-label">Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control" id="expense_date" name="expense_date"
               value="{{ expense.expense_date if expense else '' }}" required>
      </div>
      <div class="col-md-4">
        <label for="expense_type" class="form-label">Expense Type <span class="text-danger">*</span></label>
        <select class="form-select" id="expense_type" name="expense_type" required>
          <option value="">— Select Type —</option>
          {% for t in expense_types %}
          <option value="{{ t }}" {% if expense and expense.expense_type == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="amount" class="form-label">Amount (₹) <span class="text-danger">*</span></label>
        <input type="number" step="0.01" min="0.01" class="form-control" id="amount"
               name="amount" value="{{ expense.amount if expense else '' }}" required>
      </div>
      <div class="col-12">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="2">{{ expense.description if expense else '' }}</textarea>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">{{ 'Update' if expense else 'Record' }} Expense</button>
      <a href="{{ url_for('expenses.list_expenses') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
