<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Registration | GreenVolt EV</title>
  <meta name="description" content="Register as a new EV driver on GreenVolt" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-body">

<div class="login-wrapper">
  <div class="login-box" style="max-width: 480px;">
    <div class="login-logo">⚡</div>
    <h1 class="login-title">Join GreenVolt</h1>
    <p class="login-subtitle">Register to charge your EV at our nationwide hubs</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-sm py-2 mb-3">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" id="registerForm" novalidate>
      <div class="mb-3">
        <label for="full_name" class="form-label">Full Name *</label>
        <input type="text" class="form-control" id="full_name" name="full_name"
               placeholder="e.g. Rahul Sharma" required />
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="name@email.com" required />
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Phone Number *</label>
          <input type="tel" class="form-control" id="phone" name="phone"
                 placeholder="9876543210" required />
        </div>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">City / Address *</label>
        <input type="text" class="form-control" id="address" name="address"
               placeholder="e.g. Andheri East, Mumbai" required />
      </div>

      <div class="row g-2 mb-4">
        <div class="col-md-6">
          <label for="password" class="form-label">Password (min 6) *</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="••••••••" required />
        </div>
        <div class="col-md-6">
          <label for="confirm_password" class="form-label">Confirm Password *</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                 placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="registerBtn">Create Account</button>
    </form>

    <div class="text-center pt-2 border-top">
      <span class="text-muted small">Already registered?</span>
      <a href="{{ url_for('auth.login') }}" class="small ms-1 fw-medium text-decoration-none">Sign in here</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
