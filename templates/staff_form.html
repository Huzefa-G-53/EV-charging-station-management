{% extends 'base.html' %}
{% block title %}{{ 'Edit' if staff else 'Add' }} Staff{% endblock %}
{% block content %}
<div class="page-header">
  <h4>{{ 'Edit' if staff else 'Add' }} Staff Member</h4>
  <a href="{{ url_for('staff.list_staff') }}" class="btn btn-outline-secondary btn-sm mt-1">← Back</a>
</div>
<div class="form-container">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="full_name" name="full_name"
               value="{{ staff.full_name if staff else '' }}" required>
      </div>
      <div class="col-md-6">
        <label for="station_id" class="form-label">Station <span class="text-danger">*</span></label>
        <select class="form-select" id="station_id" name="station_id" required>
          <option value="">— Select Station —</option>
          {% for st in stations %}
          <option value="{{ st.station_id }}" {% if staff and staff.station_id == st.station_id %}selected{% endif %}>{{ st.station_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
        <select class="form-select" id="role" name="role" required>
          {% for r in ['Admin','Manager','Technician','Accountant','Attendant','Other'] %}
          <option value="{{ r }}" {% if staff and staff.role == r %}selected{% endif %}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" name="phone"
               value="{{ staff.phone if staff else '' }}">
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               value="{{ staff.email if staff else '' }}">
      </div>
      <div class="col-md-4">
        <label for="joining_date" class="form-label">Joining Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control" id="joining_date" name="joining_date"
               value="{{ staff.joining_date if staff else '' }}" required>
      </div>
      <div class="col-md-4">
        <label for="salary" class="form-label">Monthly Salary (₹) <span class="text-danger">*</span></label>
        <input type="number" step="0.01" min="0" class="form-control" id="salary" name="salary"
               value="{{ staff.salary if staff else '25000.00' }}" required>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">{{ 'Update' if staff else 'Add' }} Staff</button>
      <a href="{{ url_for('staff.list_staff') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
